<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repo Viewer — Premium Code Workspace</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tailwind Config Customizations (Matches CSS configuration) -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              950: '#070a13',
              900: '#0f172a',
              850: '#1e293b',
              800: '#1e293b'
            },
            indigo: {
              500: '#6366f1',
              600: '#4f46e5'
            }
          }
        }
      }
    }
  </script>
  <!-- Custom CSS Overrides -->
  <link rel="stylesheet" href="app.css">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 text-slate-100 antialiased overflow-hidden flex flex-col">

  <!-- 1. Top Navigation Bar -->
  <header class="border-b border-slate-900 bg-slate-950/80 backdrop-blur-md sticky top-0 z-40 px-4 lg:px-8 py-3.5 flex flex-col sm:flex-row items-center justify-between gap-4">
    <!-- Left: Brand / Title -->
    <div class="flex items-center space-x-3 select-none">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-600/30 animate-pulse-glow">
        <i data-lucide="folder-git-2" class="w-4 h-4 text-white"></i>
      </div>
      <span class="text-md font-extrabold tracking-wider bg-gradient-to-r from-indigo-400 via-violet-400 to-cyan-400 bg-clip-text text-transparent">
        REPO VIEWER
      </span>
    </div>

    <!-- Center/Right: Actions Toolbar -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full sm:w-auto">
      <!-- Search Input Container -->
      <div class="relative min-w-[200px] md:min-w-[280px]">
        <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search name, tags, contents..." 
          class="w-full pl-10 pr-4 py-1.5 text-xs rounded-lg bg-slate-900/60 border border-slate-800 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 transition-all text-slate-200 placeholder-slate-500"
        />
      </div>

      <!-- Category Selector Dropdown -->
      <div class="relative">
        <select 
          id="folder-filter-select"
          class="appearance-none w-full pl-3.5 pr-8 py-1.5 text-xs rounded-lg bg-slate-900/60 border border-slate-800 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 transition-all text-slate-200 cursor-pointer"
        >
          <option value="All">All Folders</option>
          <option value="Source">📁 Source</option>
          <option value="Docs">📁 Docs</option>
          <option value="Config">📁 Config</option>
          <option value="Scripts">📁 Scripts</option>
          <option value="Tests">📁 Tests</option>
        </select>
        <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-400 pointer-events-none"></i>
      </div>

      <!-- Add File Button -->
      <button 
        id="new-file-btn"
        class="flex items-center justify-center space-x-2 px-4 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white transition-all duration-200 shadow-md shadow-indigo-600/10 hover:shadow-indigo-600/30 active:scale-95"
      >
        <i data-lucide="file-plus" class="w-3.5 h-3.5"></i>
        <span>New File</span>
      </button>
    </div>
  </header>

  <!-- 2. Main Workspace Layout -->
  <main class="flex-1 overflow-hidden flex flex-col md:flex-row p-4 lg:p-6 gap-6">
    
    <!-- Sidebar Panel (Left) -->
    <section class="w-full md:w-[320px] lg:w-[360px] flex flex-col flex-shrink-0 gap-4 h-[40vh] md:h-full overflow-hidden">
      <!-- 2a. Categories filter list -->
      <div class="glass-panel rounded-2xl p-4 flex flex-col gap-2.5">
        <span class="text-[10px] uppercase font-bold tracking-wider text-slate-500 select-none">Folders</span>
        <div id="categories-container" class="grid grid-cols-3 sm:grid-cols-6 md:grid-cols-1 gap-2">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- 2b. Matching files scrollable list -->
      <div class="glass-panel rounded-2xl p-4 flex-1 flex flex-col overflow-hidden">
        <div class="flex items-center justify-between mb-3 select-none">
          <span class="text-[10px] uppercase font-bold tracking-wider text-slate-500">File Directory</span>
          <span id="sidebar-file-count" class="text-[10px] font-semibold text-slate-400 bg-slate-900 border border-slate-800 px-2 py-0.5 rounded-full">
            0 files
          </span>
        </div>
        
        <!-- Files list container -->
        <div id="file-list-container" class="flex-1 overflow-y-auto pr-1">
          <!-- Populated by JS -->
        </div>
      </div>
    </section>

    <!-- Main Content Panel (Right / Center) -->
    <section class="flex-1 flex flex-col overflow-hidden h-[50vh] md:h-full min-w-0">
      
      <!-- Preview Frame -->
      <div id="preview-wrapper" class="glass-panel rounded-2xl flex-1 flex flex-col overflow-hidden relative fade-in-content">
        
        <!-- Empty Preview State -->
        <div id="empty-preview-state" class="absolute inset-0 flex flex-col items-center justify-center text-center p-8 bg-slate-950/60 hidden">
          <div class="w-16 h-16 rounded-2xl bg-slate-900/60 border border-slate-800 flex items-center justify-center mb-4 text-slate-500">
            <i data-lucide="file-warning" class="w-8 h-8"></i>
          </div>
          <h3 class="text-md font-semibold text-slate-300">No active file selected</h3>
          <p class="text-xs text-slate-500 mt-1 max-w-[280px]">Select a file from the directory sidebar or click "New File" to create a custom entry.</p>
        </div>

        <div id="preview-container" class="flex-1 flex flex-col overflow-hidden h-full">
          
          <!-- Terminal Header Tab -->
          <div class="flex items-center justify-between border-b border-slate-900 bg-slate-950/50 px-4 py-3 select-none">
            <!-- Terminal Dots & Name -->
            <div class="flex items-center space-x-3.5 min-w-0">
              <!-- Dot indicators -->
              <div class="flex space-x-1.5 flex-shrink-0">
                <span class="w-3 h-3 rounded-full bg-rose-500/80 border border-rose-600/40"></span>
                <span class="w-3 h-3 rounded-full bg-amber-500/80 border border-amber-600/40"></span>
                <span class="w-3 h-3 rounded-full bg-emerald-500/80 border border-emerald-600/40"></span>
              </div>
              <div class="flex items-center space-x-2 min-w-0">
                <i data-lucide="file-code" class="w-4 h-4 text-indigo-400 flex-shrink-0"></i>
                <span id="preview-title" class="text-xs font-mono font-medium text-slate-300 truncate">main.js</span>
              </div>
            </div>

            <!-- Header Action buttons -->
            <div class="flex items-center space-x-2">
              <button 
                id="wrap-btn"
                title="Toggle Word Wrap"
                class="flex items-center space-x-1.5 px-2.5 py-1 text-[11px] rounded border border-slate-800 bg-slate-900/40 text-slate-400 hover:text-slate-200 transition-colors"
              >
                <i data-lucide="wrap-text" class="w-3.5 h-3.5"></i>
                <span class="hidden sm:inline">Wrap</span>
              </button>
              <button 
                id="copy-btn"
                title="Copy code to clipboard"
                class="flex items-center space-x-1.5 px-2.5 py-1 text-[11px] rounded border border-slate-800 bg-slate-900/40 text-slate-400 hover:text-slate-200 transition-colors"
              >
                <i data-lucide="clipboard" class="w-3.5 h-3.5"></i>
                <span class="hidden sm:inline">Copy</span>
              </button>
              <button 
                id="download-btn"
                title="Download file raw"
                class="flex items-center space-x-1.5 px-2.5 py-1 text-[11px] rounded border border-slate-800 bg-slate-900/40 text-slate-400 hover:text-slate-200 transition-colors"
              >
                <i data-lucide="download" class="w-3.5 h-3.5"></i>
                <span class="hidden sm:inline">Download</span>
              </button>
            </div>
          </div>

          <!-- File Metadata (Description, Tags, Read Time) -->
          <div class="p-5 border-b border-slate-900 bg-slate-950/20">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-3.5">
              <div class="flex flex-wrap items-center gap-3">
                <span id="preview-category" class="text-xs uppercase font-extrabold tracking-widest px-2 py-0.5 rounded border">
                  Source
                </span>
                <div id="preview-tags" class="flex flex-wrap gap-1.5">
                  <!-- Tags loaded by JS -->
                </div>
              </div>
              <div id="preview-read-time" class="flex-shrink-0">
                <!-- Lines & Read time -->
              </div>
            </div>
            
            <div class="flex flex-col gap-1">
              <span class="text-[10px] uppercase font-bold tracking-wider text-slate-500">File Description</span>
              <p id="preview-description" class="text-xs text-slate-300 leading-relaxed max-w-4xl">
                Loading description...
              </p>
            </div>
          </div>

          <!-- Code Content Panel -->
          <div class="flex-1 overflow-auto bg-slate-950/45 relative flex flex-col font-mono text-sm py-4">
            <div id="preview-code" class="h-full flex-1">
              <!-- Code render with line numbers -->
            </div>
          </div>

        </div>
      </div>

      <!-- Pagination Footer -->
      <footer class="mt-4 flex items-center justify-between bg-slate-950/40 border border-slate-900 rounded-xl px-4 py-2.5 select-none">
        <button 
          id="prev-btn" 
          disabled
          class="flex items-center space-x-2 px-3 py-1 text-xs font-semibold rounded-lg text-slate-400 transition-colors bg-slate-900 border border-slate-800 opacity-40 cursor-not-allowed"
        >
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span>Previous</span>
        </button>

        <span 
          id="page-counter" 
          class="text-xs font-mono font-bold text-slate-400 bg-slate-900 px-3 py-1 rounded-full border border-slate-800/80"
        >
          1/10
        </span>

        <button 
          id="next-btn"
          class="flex items-center space-x-2 px-3 py-1 text-xs font-semibold rounded-lg text-slate-400 transition-colors bg-slate-900 border border-slate-800 hover:bg-slate-800 hover:text-slate-200"
        >
          <span>Next</span>
          <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
        </button>
      </footer>
    </section>

  </main>

  <!-- 3. Create File Dialog Modal -->
  <div 
    id="new-file-modal" 
    class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm items-center justify-center p-4 hidden"
  >
    <div class="glass-panel w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden animate-pulse-glow">
      <!-- Modal Header -->
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-900 bg-slate-950/40">
        <div class="flex items-center space-x-2.5">
          <i data-lucide="file-plus-2" class="w-4 h-4 text-indigo-400"></i>
          <h3 class="text-sm font-bold text-slate-200">Create New Repository File</h3>
        </div>
        <button 
          id="modal-close-btn"
          class="text-slate-400 hover:text-slate-200 transition-colors"
        >
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Modal Body Form -->
      <form id="new-file-form" class="p-5 space-y-4">
        <!-- Name -->
        <div class="grid grid-cols-1 gap-1.5">
          <label for="modal-file-name" class="text-xs font-bold text-slate-400">File Name & Path <span class="text-rose-500">*</span></label>
          <input 
            type="text" 
            id="modal-file-name" 
            required
            placeholder="e.g. src/components/Button.js"
            class="w-full px-3 py-2 text-xs rounded-lg bg-slate-950 border border-slate-850 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 text-slate-200"
          />
        </div>

        <!-- Row: Category & Tags -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Folder Category -->
          <div class="grid grid-cols-1 gap-1.5">
            <label for="modal-file-category" class="text-xs font-bold text-slate-400">Folder Category <span class="text-rose-500">*</span></label>
            <select 
              id="modal-file-category" 
              required
              class="w-full px-3 py-2 text-xs rounded-lg bg-slate-950 border border-slate-850 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 text-slate-200 cursor-pointer"
            >
              <option value="Source">Source (Src)</option>
              <option value="Docs">Docs</option>
              <option value="Config">Config</option>
              <option value="Scripts">Scripts</option>
              <option value="Tests">Tests</option>
            </select>
          </div>

          <!-- Tags -->
          <div class="grid grid-cols-1 gap-1.5">
            <label for="modal-file-tags" class="text-xs font-bold text-slate-400">Tags (comma separated)</label>
            <input 
              type="text" 
              id="modal-file-tags" 
              placeholder="e.g. ui, react, button"
              class="w-full px-3 py-2 text-xs rounded-lg bg-slate-950 border border-slate-850 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 text-slate-200"
            />
          </div>
        </div>

        <!-- Description -->
        <div class="grid grid-cols-1 gap-1.5">
          <label for="modal-file-desc" class="text-xs font-bold text-slate-400">File Description <span class="text-rose-500">*</span></label>
          <input 
            type="text" 
            id="modal-file-desc" 
            required
            placeholder="What is this file about?"
            class="w-full px-3 py-2 text-xs rounded-lg bg-slate-950 border border-slate-850 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 text-slate-200"
          />
        </div>

        <!-- Content -->
        <div class="grid grid-cols-1 gap-1.5">
          <label for="modal-file-content" class="text-xs font-bold text-slate-400">File Content (Code/Text) <span class="text-rose-500">*</span></label>
          <textarea 
            id="modal-file-content" 
            required
            rows="6"
            placeholder="Write or paste your file content here..."
            class="w-full px-3 py-2 text-xs rounded-lg bg-slate-950 border border-slate-850 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 text-slate-200 font-mono"
          ></textarea>
        </div>

        <!-- Submit actions -->
        <div class="flex items-center justify-end space-x-2 pt-2">
          <button 
            type="button" 
            onclick="document.getElementById('new-file-modal').classList.add('hidden')"
            class="px-4 py-2 text-xs font-semibold rounded-lg bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-400 transition-colors"
          >
            Cancel
          </button>
          <button 
            type="submit" 
            class="px-4 py-2 text-xs font-semibold rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white transition-colors"
          >
            Create File
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 4. Floating Toast Notification Container -->
  <div 
    id="toast-container" 
    class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"
  >
    <!-- Injected dynamically by JS -->
  </div>

  <!-- 5. App Script Connection -->
  <script src="app.js"></script>

</body>
</html>
